brand_name: GUARDIAN

description: >
  Multi-agent biodiversity defense platform for Fortune 500 sponsors of
  protected conservation reserves. Real cameras detect threats; ADK 2.0
  orchestrates Gemini 2.5 Pro/Flash specialists + an adversarial Falsifier
